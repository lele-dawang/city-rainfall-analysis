/* 短历时设计雨量表 */
function swDurTable(dur){
  const rows = [["1h","1 h"],["2h","2 h"],["3h","3 h"],["6h","6 h"],["24h","24 h"]];
  const PAD = 'style="padding:5px 0;border-top:1px solid #eef4f7"';
  let h = '<div style="overflow-x:auto;margin:6px 0 2px"><table style="width:100%;border-collapse:collapse;font-size:12.5px;text-align:center;min-width:420px">'
    + '<tr style="color:var(--muted);font-size:11.5px">'
    + '<th style="text-align:left;padding:4px 0;font-weight:600">历时</th>'
    + '<th style="padding:4px 0;font-weight:600">2 年</th><th style="padding:4px 0;font-weight:600">5 年</th>'
    + '<th style="padding:4px 0;font-weight:600">10 年</th><th style="padding:4px 0;font-weight:600">20 年</th>'
    + '<th style="padding:4px 0;font-weight:600">实测最大</th></tr>';
  rows.forEach(([k, label]) => {
    const d = dur[k];
    if(!d) return;
    h += `<tr><td style="padding:5px 0;border-top:1px solid #eef4f7;text-align:left;font-weight:600">${label}</td>`
       + `<td ${PAD}>${d[0]}</td><td ${PAD}>${d[1]}</td><td ${PAD}>${d[2]}</td>`
       + `<td ${PAD}><b>${d[3]}</b></td><td ${PAD}><span style="color:#b45309">${d[4]}</span></td></tr>`;
  });
  return h + '</table></div>';
}

/* 生成当前城市的管网卡片（无数据时返回空串） */
function swCard(name){
  const s = SWMM[name];
  if(!s) return '';
  const scen = s.scen, on = s.on;
  const rain20 = s.d2[3];
  const onsetTxt = on
    ? `约 <b style="color:var(--accent)">${on} mm/2 h</b>（约 ${(on/2).toFixed(1)} mm/h 平均雨强），约为 20 年一遇设计值的 ${(on/rain20).toFixed(1)} 倍。该值可作为<b>排水防涝预警的雨强阈值参考</b>。`
    : `在本模型的扫描范围（至 20 年一遇设计值的 5 倍）内<b>未出现检查井溢流</b>，说明该城市降雨条件下这套管网的余量充足。`;
  return `
    <div class="card"><h2>🏗 排水管网水力模型（SWMM）· ${name}</h2>
      <div class="note" style="margin-top:0">
        同一套<b>概化管网</b>（服务面积 5.00 ha、综合径流系数约 0.60、7 座检查井 + 7 段管道 DN300~DN600、井深 2.5 m）
        在 <b>${name}</b> 降雨条件下的校核结果。管网按常规小区布置形式<b>概化</b>（非实测 GIS 拓扑），
        各城市共用同一套管网，<b>变化的只有降雨输入</b>。用途为方案级校核与内涝风险比较。
      </div>
      <div class="chart" id="c5"></div>
      <div class="note">纵轴为<b>最大满流比</b>（管段最大流量 ÷ 满流流量），图中虚线为满流线（比值 = 1.0）。
        满流比 &gt; 1.0 表示管道由无压满流转为<b>承压运行</b>（水力坡度线超过管顶）。
        前四根柱为按 2 h 设计暴雨演算，最后一根为实测最不利降雨过程。</div>

      <div style="font-size:13px;font-weight:700;color:var(--ink);margin:16px 0 4px">
        短历时设计雨量（1~24 h，超阈值抽样 POT 含去丛，阈值 3 mm）</div>
      ${swDurTable(s.dur)}
      <div class="note">单位 mm。基于 ${name} 近 5.75 年<b>逐小时</b>降雨（ERA5 再分析）估算（本地有缓存记录的城市）。
        <b>去丛是必须的</b>——滚动窗口直接取样会把同一场雨的相邻时刻重复计入，使年事件率虚高、设计值偏大。</div>

      <div style="font-size:13px;font-weight:700;color:var(--ink);margin:16px 0 4px">
        内涝临界雨量（防涝预警阈值）</div>
      <div class="chart" id="c6"></div>
      <div class="note">横轴为 2 h 降雨量（mm），左轴为地面积水总量（m³），右轴为溢流检查井数。
        把 20 年一遇设计雨型逐级放大，考察检查井开始溢流（地面积水）的临界点：${onsetTxt}</div>

      <div class="concl" style="margin-top:12px">
        ${name} 按"24 h 雨量平均强度"初选管径（上方 Q=ΨqF，q=P/24），
        在 2 年一遇时最大满流比 <b>${scen[0][2].toFixed(2)}</b>（承压 <b>${scen[0][3]}/7</b> 段）；
        <b>20 年一遇</b>时达 <b>${scen[3][2].toFixed(2)}</b>（承压 <b>${scen[3][3]}/7</b> 段）；
        实测极端降雨过程下达 <b>${scen[4][2].toFixed(2)}</b>（承压 ${scen[4][3]}/7 段）。
        短历时峰值强度可达 24 h 平均强度的数倍——这正是<b>用平均强度估算设计流量会低估峰值流量</b>的直接证据，
        也说明必须引入短历时频率分析与管网水力模型。
      </div>
      <div class="note">局限：① 管网为概化管网，非实测 GIS；② ERA5 逐小时数据无法分辨小时内雨强脉动，
        短历时（&lt;1 h）峰值存在低估；③ 雨型参数由 POT 的 1 h/2 h 比值率定，与当地实测雨型仍有差异；
        ④ 样本 5.75 年，POT 重现期估计置信区间较宽；⑤ 未考虑管网沉积、堵塞与地下水入渗。
        正式设计应采用当地 ≥20 年暴雨资料与当地暴雨强度公式（GB 50014）。</div>
    </div>`;
}

function mkChart(id){
  if(charts[id]) charts[id].dispose();
  const el = document.getElementById(id);
  charts[id] = el ? echarts.init(el) : null;
  return charts[id];
}
window.addEventListener("resize", () => Object.values(charts).forEach(c => c && c.resize()));

async function fetchJ(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

/* ---------- 专业分析模型 ---------- */
// 超阈值法(POT) + 指数分布：x_T = u + β·ln(T·λ)，u=阈值，β=超出量均值，λ=年均超阈次数
function returnPeriods(rain, u = 5){
  const evs = rain.filter(r => r >= u);
  const beta = evs.length ? evs.reduce((s, r) => s + (r - u), 0) / evs.length : 0;
  const nYr = Math.max(rain.length / 365.25, 1e-6);
  const lam = evs.length / nYr;
  const p = T => u + beta * Math.log(Math.max(1e-6, T * lam));
  return { p2: p(2), p5: p(5), p10: p(10), p20: p(20), events: evs.length, beta, lam };
}
// 推理公式法估算雨水设计流量：Q = Ψ·q·F（q 取 T 年重现期 24h 雨量折算平均强度）
function designFlow(Pmm24, psi, Fha){
  const q = Pmm24 / 24;                    // mm/h（24h 平均强度近似）
  const Q = psi * q * Fha * 10 / 3600;     // m³/s（q mm/h→m/h /1000，F ha→m² ×10000，/3600）
  const v = 1.0;                           // m/s，满流圆管初选流速
  const Dm = Q > 0 ? Math.sqrt(4 * Q / (Math.PI * v)) : 0;
  return { q: Math.round(q * 10) / 10, Q: Math.round(Q * 1000) / 1000, Dmm: Math.round(Dm * 1000) };
}
const DN = [75,100,150,200,250,300,400,500,600,800,1000,1200];
function dnPick(Dmm){ for(const d of DN) if(Dmm <= d) return d; return DN[DN.length-1]; }

let loadSeq = 0;   // 请求序号：防止快速切换城市时旧请求覆盖新结果
async function load(){
  const seq = ++loadSeq;
  const cv = $("#customCity").value.trim();
  if(cv){
    // 兼容 /、|、全角｜／（手机输入法常见问题）
    const norm = cv.replace(/[｜]/g, "|").replace(/[／]/g, "/");
    const p = norm.split(/[/|]/);
    if(p.length === 3 && p[1] && p[2]){
      CITY.lat = +p[1]; CITY.lng = +p[2]; CITY.name = p[0] || "自定义";
    }else{ alert("自定义格式：城市名/纬度/经度，如 石家庄/38.04/114.51"); return; }
  }else{
    const [n, la, lo] = $("#citySel").value.split("|");
    CITY.name = n; CITY.lat = +la; CITY.lng = +lo;
  }
  $("#app").innerHTML = `<div class="state"><div class="spin"></div><h2 style="font-size:15px">正在获取 ${esc(CITY.name)} 降雨数据…</h2></div>`;
  try{
    const base = `https://api.open-meteo.com/v1/forecast?latitude=${CITY.lat}&longitude=${CITY.lng}&timezone=Asia%2FShanghai`;
    // 快速路径：90天历史+7天预报+逐小时（约2秒），先渲染出页面
    const [d, h] = await Promise.all([
      fetchJ(base + "&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,precipitation_probability_max&past_days=90&forecast_days=7"),
      fetchJ(base + "&hourly=precipitation,precipitation_probability,temperature_2m&past_days=7&forecast_days=1")
    ]);
    if(seq !== loadSeq) return;   // 已有更新的请求，丢弃过期结果
    _dh = { d, h };
    HIST = { kind: "90d", note: "" };
    render({ daily: { time: d.daily.time.slice(0, 90), precipitation_sum: d.daily.precipitation_sum.slice(0, 90) } }, d, h);
    loadHistory(seq);   // 后台加载 5 年历史（带缓存），到达后自动升级重现期
  }catch(e){
    $("#app").innerHTML = `<div class="state"><h2 style="font-size:15px">😥 数据获取失败，请检查网络</h2>
      <p style="font-size:13px;margin-top:6px">${esc(e.message)}</p>
      <button style="margin-top:14px;padding:8px 22px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer" onclick="load()">重试</button></div>`;
  }
}

let HIST = { kind: "90d", note: "" };   // 历史数据状态：90d(快) / 5y(升级) / 失败降级
let _dh = null;                          // 最近一次 d/h，供历史重试

async function loadHistory(seqIn){
  const seq = seqIn === undefined ? loadSeq : seqIn;   // 重试按钮不带参数调用时沿用当前请求
  const { d, h } = _dh || {};
  if(!d) return;
  const now = new Date(Date.now() - 864e5);
  const y5 = new Date(now.getFullYear() - 5, now.getMonth(), now.getDate());
  const D = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${CITY.lat}&longitude=${CITY.lng}&start_date=${D(y5)}&end_date=${D(now)}&daily=precipitation_sum&timezone=Asia%2FShanghai`;
  try{
    const a = await cachedFetch(url, 6 * 3600e3);   // 6 小时本地缓存，二次打开秒级
    if(seq !== loadSeq) return;   // 已切换到新城市，丢弃过期结果
    HIST = { kind: "5y", note: "" };
    render(a, d, h);
  }catch(e){
    if(seq !== loadSeq) return;
    HIST = { kind: "90d", note: "5 年历史数据加载失败（网络原因），重现期暂基于近90天样本估算" };
    render({ daily: { time: d.daily.time.slice(0, 90), precipitation_sum: d.daily.precipitation_sum.slice(0, 90) } }, d, h);
  }
}

async function cachedFetch(url, ttl){
  const key = "hist_" + url;
  try{
    const c = JSON.parse(localStorage.getItem(key) || "null");
    if(c && c.data && Date.now() - c.ts < ttl) return c.data;   // 命中缓存
  }catch(e){}
  const data = await fetchTimeout(url, 15000);
  try{
    localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  }catch(e){   // 超出配额：清理旧缓存后重存
    try{
      for(const k of Object.keys(localStorage)) if(k.startsWith("hist_")) localStorage.removeItem(k);
      localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
    }catch(e2){}
  }
  return data;
}

async function fetchTimeout(url, ms){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(url, { signal: ctl.signal });
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }finally{ clearTimeout(t); }
}

function render(a, d, h){
  // 当前城市的管网校核数据与卡片（无则返回空串，不显示卡片）
  const _sw = SWMM[CITY.name] || null;
  const _swCard = swCard(CITY.name);
  // 等待 ECharts 异步加载完成（动态 CDN 加载，不阻塞页面）
  if(!window.echarts){ setTimeout(() => render(a, d, h), 200); return; }
  // 保留用户正在调整的计算器参数（历史数据到达后的二次渲染不重置）
  const sv = {};
  for(const id of ["psi", "Fha", "Tsel", "q"]){ const el = document.getElementById(id); if(el) sv[id] = el.value; }
  // 历史：5 年档案数据（重现期依据）；近 90 天切片（统计与图表）
  const histAll = a.daily.time.map((t, i) => ({ t, r: a.daily.precipitation_sum[i] || 0 }));
  const hist = histAll.slice(-90);
  const days = d.daily;
  const fc = days.time.map((t, i) => ({ t, r: days.precipitation_sum[i] || 0, h: days.temperature_2m_max[i] || 0 }));

  // 统计指标
  const sum = hist.reduce((s, x) => s + x.r, 0);
  const maxDay = hist.reduce((a, b) => b.r > a.r ? b : a, { r: 0 });
  const storm = hist.filter(x => x.r >= 50).length;
  const heavy = hist.filter(x => x.r >= 25 && x.r < 50).length;
  const wet = hist.filter(x => x.r >= 0.1).length;
  let streak = 0, best = 0;
  for(const x of hist){ if(x.r < 0.5) streak++, best = Math.max(best, streak); else streak = 0; }
  const sumFc = fc.reduce((s, x) => s + x.r, 0);
  const maxFc = fc.reduce((a, b) => b.r > a.r ? b : a, { r: 0, t: fc[0].t });

  // 重现期（基于 5 年历史）+ 设计流量
  const rp = returnPeriods(histAll.map(x => x.r));
  const years = (histAll.length / 365.25).toFixed(1);
  const psi0 = 0.6, F0 = 5, T0 = 5;
  const df0 = designFlow(T0 === 5 ? rp.p5 : (T0 === 2 ? rp.p2 : (T0 === 10 ? rp.p10 : rp.p20)), psi0, F0);

  $("#app").innerHTML = `
    <div class="cards">
      <div class="kpi"><div class="l">近90天累计降雨</div><div class="v">${fmt(sum)}<small> mm</small></div></div>
      <div class="kpi"><div class="l">最大单日降雨</div><div class="v">${fmt(maxDay.r)}<small> mm</small></div><div class="l" style="margin-top:2px">${maxDay.t.slice(5)}</div></div>
      <div class="kpi"><div class="l">降雨天数(≥0.1mm)</div><div class="v">${wet}<small> 天</small></div></div>
      <div class="kpi"><div class="l">大雨日(25-50mm)</div><div class="v">${heavy}<small> 天</small></div></div>
      <div class="kpi"><div class="l">暴雨日(≥50mm)</div><div class="v">${storm}<small> 天</small></div></div>
      <div class="kpi"><div class="l">最长连续无雨</div><div class="v">${best}<small> 天</small></div></div>
      <div class="kpi"><div class="l">历史样本(重现期依据)</div><div class="v">${HIST.kind === "5y" ? years : "90"}<small> ${HIST.kind === "5y" ? "年" : "天"}</small></div><div class="l" style="margin-top:2px">${histAll.length} 天 · ${rp.events} 场降雨</div></div>
    </div>

    <div class="card"><h2>📊 近90天逐日降雨量（${esc(CITY.name)}）</h2>
      <div class="chart" id="c1"></div>
      <div class="note">柱色按降雨等级着色：小雨&lt;10mm ｜ 中雨10–25mm ｜ 大雨25–50mm ｜ 暴雨≥50mm</div>
    </div>

    <div class="card"><h2>📈 设计暴雨重现期估算（超阈值法 + 指数分布）</h2>
      <div class="chart" id="c2"></div>
      <div class="note">${HIST.kind === "5y"
        ? `基于近 ${years} 年历史样本（${histAll[0].t} ~ ${histAll[histAll.length-1].t}，共 ${histAll.length} 天，ERA5 再分析）`
        : "基于近90天样本（预报模型历史回溯）"}，阈值 u=5mm，共识别 ${rp.events} 场降雨事件。
        指数分布拟合 x_T = u + β·ln(T·λ)，β=${rp.beta.toFixed(1)}mm，年均事件率 λ≈${rp.lam.toFixed(1)} 次/年。
        正式设计请采用当地多年暴雨资料与当地暴雨强度公式（GB50014-2021）。
        ${HIST.note ? `<br><span style="color:#b45309">⚠️ ${esc(HIST.note)} <button onclick="loadHistory()" style="border:none;background:var(--accent);color:#fff;border-radius:8px;padding:2px 12px;cursor:pointer;font-size:12px">重试</button></span>` : ""}</div>
    </div>

    <div class="card"><h2>🔧 雨水设计流量估算（推理公式 Q = Ψ·q·F）</h2>
      <div class="calc">
        <label><span>径流系数 Ψ</span><input type="range" id="psi" min="0.1" max="0.95" step="0.05" value="${psi0}" oninput="calcFlow()"><output id="psiV">${psi0}（绿地/道路混合，可参考 GB50014）</output></label>
        <label><span>汇水面积 F</span><input type="range" id="Fha" min="0.5" max="50" step="0.5" value="${F0}" oninput="calcFlow()"><output id="FhaV">${F0} ha（示例小区）</output></label>
        <label><span>设计重现期 T</span><select id="Tsel" onchange="calcFlow()">
          <option value="2">2 年一遇</option><option value="5" selected>5 年一遇</option>
          <option value="10">10 年一遇</option><option value="20">20 年一遇</option>
        </select><output id="TV">5 年一遇 24h 设计雨量 ${fmt(rp.p5)} mm</output></label>
        <label><span>设计暴雨强度 q</span><input type="range" id="q" min="0.5" max="20" step="0.1" value="${df0.q.toFixed(1)}" oninput="calcFlow(true)"><output id="qV">${df0.q.toFixed(1)} mm/h（可手动覆盖）</output></label>
        <div class="calc-result" id="calcResult"></div>
      </div>
      <div class="note">计算式：Q = Ψ·q·F = Ψ × (P<sub>T</sub>/24) × F；Q 为雨水设计流量(m³/s)，q 为暴雨强度(mm/h，24h 平均强度近似)，
        F 为汇水面积(ha)。管径按满流圆管初选（n 取 0.013，流速 1.0 m/s）。正式设计应按当地暴雨强度公式与推理公式法/模型法复核。</div>
    </div>

    <div class="card"><h2>🔮 未来7天降雨预报 + 气温</h2>
      <div class="chart" id="c3"></div>
    </div>

    <div class="card"><h2>⏱ 近7天逐小时降雨量</h2>
      <div class="chart" id="c4"></div>
    </div>

    <div class="card"><h2>🧠 分析结论</h2>
      <div class="concl">
        <b>${esc(CITY.name)}</b> 近90天累计降雨 <b>${fmt(sum)} mm</b>（降雨 ${wet} 天），最大单日 <b>${fmt(maxDay.r)} mm</b>（${maxDay.t.slice(5)}），
        大雨日 <b>${heavy}</b> 天、暴雨日 <b>${storm}</b> 天，最长连续无雨 <b>${best}</b> 天。
        ${HIST.kind === "5y" ? `基于近 ${years} 年历史样本估算，` : (HIST.note ? "历史数据加载失败，基于近90天样本估算，" : "基于近90天样本估算（5年历史加载中…），")}5 年一遇 24h 设计雨量约 <b>${fmt(rp.p5)} mm</b>；按 Ψ=${psi0}、F=${F0} ha 估算设计流量 <b>${df0.Q.toFixed(3)} m³/s</b>，初选管径 <b>DN${dnPick(df0.Dmm)}</b>。
        未来7天预计降雨 <b>${fmt(sumFc)} mm</b>，最大 <b>${fmt(maxFc.r)} mm</b>（${maxFc.t.slice(5)}）。
        ${storm > 0 ? "⚠️ 近期出现过暴雨，雨水管渠设计需关注极端降雨与重现期校核。" : ""}
        ${best >= 10 ? `⚠️ 已连续 ${best} 天无有效降雨，注意旱情与绿化补水。` : ""}
        ${sumFc >= 30 ? "💧 未来一周降雨较多，出行与施工注意排水防涝。" : "🌤️ 未来一周降雨总体温和。"}
      </div>
    </div>
    ${_swCard}
`;

  // 恢复计算器参数（二次渲染不重置用户调整）
  for(const id in sv){ const el = document.getElementById(id); if(el) el.value = sv[id]; }

  // 图表1：近90天
  const c1 = mkChart("c1");
  c1.setOption({
    grid:{ left:44, right:12, top:16, bottom:30 },
    tooltip:{ trigger:"axis" },
    dataZoom:[{ type:"inside", start:0, end:100 }],
    xAxis:{ type:"category", data: hist.map(x => x.t.slice(5).replace("-","/")), axisLabel:{ fontSize:10, color:"#8aa3ad" } },
    yAxis:{ type:"value", name:"mm", nameTextStyle:{ color:"#8aa3ad" }, axisLabel:{ color:"#8aa3ad" } },
    series:[{ type:"bar", data: hist.map(x => ({ value: +x.r.toFixed(1), itemStyle:{ color: grade(x.r).c } })), barMaxWidth:12 }]
  });
  // 图表2：重现期
  const c2 = mkChart("c2");
  c2.setOption({
    grid:{ left:44, right:12, top:16, bottom:30 },
    tooltip:{ trigger:"axis" },
    xAxis:{ type:"category", data:["2 年一遇","5 年一遇","10 年一遇","20 年一遇"], axisLabel:{ fontSize:11, color:"#8aa3ad" } },
    yAxis:{ type:"value", name:"24h 设计雨量 mm", nameTextStyle:{ color:"#8aa3ad" }, axisLabel:{ color:"#8aa3ad" } },
    series:[{
      type:"bar", barMaxWidth:48,
      data:[
        { value:+rp.p2.toFixed(1), itemStyle:{ color:"#7dd3fc" } },
        { value:+rp.p5.toFixed(1), itemStyle:{ color:"#0ea5e9" } },
        { value:+rp.p10.toFixed(1), itemStyle:{ color:"#0369a1" } },
        { value:+rp.p20.toFixed(1), itemStyle:{ color:"#0c4a6e" } }
      ],
      label:{ show:true, position:"top", fontSize:12, color:"#0f3d4d", formatter:p => p.value + " mm" }
    }]
  });
  // 图表3：未来7天
  const c3 = mkChart("c3");
  c3.setOption({
    grid:{ left:44, right:44, top:24, bottom:28 },
    tooltip:{ trigger:"axis" },
    legend:{ data:["降雨量","最高温"], textStyle:{ fontSize:11, color:"#8aa3ad" }, top:0 },
    xAxis:{ type:"category", data: fc.map(x => x.t.slice(5).replace("-","/")), axisLabel:{ fontSize:11, color:"#8aa3ad" } },
    yAxis:[
      { type:"value", name:"mm", nameTextStyle:{ color:"#8aa3ad" }, axisLabel:{ color:"#8aa3ad" } },
      { type:"value", name:"°C", nameTextStyle:{ color:"#8aa3ad" }, axisLabel:{ color:"#8aa3ad" } }
    ],
    series:[
      { name:"降雨量", type:"bar", data: fc.map(x => ({ value:+x.r.toFixed(1), itemStyle:{ color: grade(x.r).c } })), barMaxWidth:40 },
      { name:"最高温", type:"line", yAxisIndex:1, smooth:true, data: fc.map(x => Math.round(x.h)), lineStyle:{ color:"#f59e0b" }, itemStyle:{ color:"#f59e0b" } }
    ]
  });
  // 图表4：逐小时
  const hr = h.hourly;
  const hrData = hr.time.map((t, i) => ({ t: t.slice(5, 16), r: hr.precipitation[i] || 0 }));
  const c4 = mkChart("c4");
  c4.setOption({
    grid:{ left:44, right:12, top:16, bottom:30 },
    tooltip:{ trigger:"axis" },
    xAxis:{ type:"category", data: hrData.map(x => x.t), axisLabel:{ fontSize:10, color:"#8aa3ad", hideOverlap:true,
      interval:(i, v) => v.indexOf("00:00") >= 0,           // 每天只标一个刻度（0 点）
      formatter: v => v.slice(0, 5).replace("-", "/") } },   // 标签缩短为 10/03
    yAxis:{ type:"value", name:"mm", nameTextStyle:{ color:"#8aa3ad" }, axisLabel:{ color:"#8aa3ad" } },
    series:[{ type:"bar", data: hrData.map(x => ({ value:+x.r.toFixed(2), itemStyle:{ color: grade(x.r).c } })), barMaxWidth:3 }]
  });



  /* ---------- SWMM 管网卡片图表（随城市联动） ---------- */
  if(_sw){
    const c5 = mkChart("c5");
    if(c5) c5.setOption({
      grid:{ left:44, right:14, top:30, bottom:34 },
      tooltip:{ trigger:"axis",
        formatter: p => `${p[0].axisValue}<br/>降雨 ${_sw.scen[p[0].dataIndex][1]} mm<br/>最大满流比 <b>${p[0].value}</b><br/>承压管道 ${_sw.scen[p[0].dataIndex][3]}/7 段` },
      xAxis:{ type:"category", axisLabel:{ fontSize:11, color:"#8aa3ad" },
        data: _sw.scen.map(s => s[0]) },
      yAxis:{ type:"value", max:3.4, axisLabel:{ color:"#8aa3ad" } },
      series:[{
        type:"bar", barMaxWidth:46,
        data: _sw.scen.map((s, i) => ({ value:s[2],
          itemStyle:{ color:["#7dd3fc","#0ea5e9","#0284c7","#075985","#7f1d1d"][i] } })),
        label:{ show:true, position:"top", fontSize:12, color:"#0f3d4d", formatter:p => p.value.toFixed(2) },
        markLine:{ silent:true, symbol:"none",
          lineStyle:{ color:"#4a6b78", type:"dashed" }, data:[{ yAxis:1 }] }
      }],
      graphic:[{ type:"text", left:56, top:6,
        style:{ text:"- - - 满流（无压流上限）", fontSize:10, fill:"#4a6b78" } }]
    });
    const c6 = mkChart("c6");
    if(c6) c6.setOption({
      grid:{ left:52, right:52, top:34, bottom:30 },
      tooltip:{ trigger:"axis" },
      legend:{ data:["地面积水总量","溢流检查井数"], textStyle:{ fontSize:11, color:"#8aa3ad" }, top:0, right:0 },
      xAxis:{ type:"category", axisLabel:{ fontSize:11, color:"#8aa3ad" },
        data: _sw.scan.map(s => s[0]) },
      yAxis:[
        { type:"value", name:"m³", nameTextStyle:{ color:"#8aa3ad" }, axisLabel:{ color:"#8aa3ad" } },
        { type:"value", name:"井数", max:8, nameTextStyle:{ color:"#8aa3ad" }, axisLabel:{ color:"#8aa3ad" } }
      ],
      series:[
        { name:"地面积水总量", type:"line", smooth:true,
          data: _sw.scan.map(s => s[1]),
          lineStyle:{ color:"#0ea5e9", width:2.5 }, itemStyle:{ color:"#0ea5e9" },
          markLine:{ silent:true, symbol:"none",
            lineStyle:{ color:"#059669", type:"dashdot" },
            label:{ formatter: _sw.on ? ("内涝临界\n" + _sw.on + " mm/2h") : "", fontSize:10, color:"#059669" },
            data: _sw.on ? [{ xAxis: _sw.scan.findIndex(s => s[2] > 0) }] : [] } },
        { name:"溢流检查井数", type:"line", yAxisIndex:1, smooth:true,
          data: _sw.scan.map(s => s[2]),
          lineStyle:{ color:"#f59e0b", width:2, type:"dashed" }, itemStyle:{ color:"#f59e0b" } }
      ]
    });
  }

  // 计算器状态 + 导出数据快照
  window._flow = { rp };
  window._last = { hist: histAll, fc, rp, sum, maxDay, storm, heavy, wet, best, sumFc, maxFc, city: CITY.name };
  qTouched = false;
  calcFlow();
}

let qTouched = false;   // 用户是否手动改过 q（改过后不再自动联动）
function calcFlow(fromQ){
  const psi = +$("#psi").value, F = +$("#Fha").value, T = +$("#Tsel").value;
  const rp = (window._flow || { rp: { p2:0, p5:0, p10:0, p20:0 } }).rp;
  const P = T === 2 ? rp.p2 : T === 5 ? rp.p5 : T === 10 ? rp.p10 : rp.p20;
  if(fromQ) qTouched = true;
  if(!fromQ && !qTouched) $("#q").value = (P / 24).toFixed(1);
  const qOverride = +$("#q").value;
  const df = designFlow(P, psi, F);
  $("#psiV").textContent = psi.toFixed(2) + "（绿地/道路混合，可参考 GB50014）";
  $("#FhaV").textContent = F.toFixed(1) + " ha（示例小区）";
  $("#TV").textContent = T + " 年一遇 24h 设计雨量 " + fmt(P) + " mm";
  $("#qV").textContent = qOverride.toFixed(1) + " mm/h（可手动覆盖）";
  $("#calcResult").innerHTML = `
    <div>设计流量 <span class="big">Q = ${df.Q.toFixed(3)} m³/s</span>，初选管径 <span class="big">DN${dnPick(df.Dmm)}</span>
      <span style="font-size:12px;color:var(--muted)">（按满流圆管 v=1.0m/s 估算）</span></div>
    <div class="eq">Q = Ψ·q·F = ${psi} × ${qOverride.toFixed(1)} mm/h × ${F} ha × 10 / 3600 = ${df.Q.toFixed(3)} m³/s</div>`;
}

/* ---------- 导出 ---------- */
function exportJSON(){
  const data = {
    city: CITY.name, lat: CITY.lat, lng: CITY.lng,
    generatedAt: new Date().toISOString(),
    disclaimer: "基于公开气象数据与近5年历史样本（ERA5 再分析）的估算，正式设计需采用当地多年暴雨资料与规范方法。",
    ...window._last
  };
  download("analysis_" + CITY.name + ".json", JSON.stringify(data, null, 2), "application/json");
}
function exportCSV(){
  const rows = window._last ? window._last.hist : [];
  if(!rows.length){ alert("暂无数据"); return; }
  const csv = "date,rainfall_mm\n" + rows.map(r => r.t.slice(0,10) + "," + r.r.toFixed(1)).join("\n");
  download("rainfall_" + CITY.name + ".csv", csv, "text/csv");
}
function download(name, content, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

load();
</script>
